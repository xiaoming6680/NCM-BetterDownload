<!doctype html>

<head>
<meta charset="utf-8">
<title>BetterDownload 封面</title>
<style>
/* 1080 × 1920; everything sits inside the middle 1080 × 1440, the 3:4 crop a profile grid shows. */
@font-face{font-family:PF;src:local("PingFang SC Medium"),local("PingFangSC-Medium");font-weight:500}
@font-face{font-family:PF;src:local("PingFang SC Semibold"),local("PingFangSC-Semibold"),local("PingFang SC Bold");font-weight:600}
@font-face{font-family:PF;src:local("PingFang SC Bold"),local("PingFangSC-Semibold");font-weight:700}
@font-face{font-family:PF;src:local("PingFang SC Heavy"),local("PingFang SC Bold");font-weight:800}
:root{--font:PF,"Noto Sans SC","Microsoft YaHei UI",sans-serif;--ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;--brand:linear-gradient(135deg,#f39bc4,#9a8bff 52%,#5eaefc)}
*{box-sizing:border-box;margin:0;padding:0}
body{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;color:#f5f5f7;font-family:var(--font);-webkit-font-smoothing:antialiased}
.glow{position:absolute;border-radius:50%}
.row{position:absolute;left:0;right:0;text-align:center;white-space:nowrap}
.kicker{font-size:40px;font-weight:600;color:#a1a1a6;letter-spacing:.02em}
.title{font-size:128px;font-weight:800;line-height:1.1}
.grad{background:linear-gradient(90deg,#f7a6cf,#a796ff 48%,#68b4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.big{font-size:156px}
.subtitle{font-size:44px;font-weight:600;color:#d2d2d7}
.tile{position:absolute;top:870px;width:300px}
.art{position:relative;width:300px;height:300px;border-radius:44px;overflow:hidden;background:radial-gradient(circle at 66% 34%,#ffe3ad 0 15%,#ffe3ad00 15.6%),radial-gradient(70% 55% at 66% 34%,#ffe3ad66,#ffe3ad00 70%),linear-gradient(#5a1e4a00 69%,#5a1e4a 69.4%),linear-gradient(165deg,#ffb07a,#d94a82);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14),0 40px 80px -30px #000}
.before .art{filter:grayscale(1) brightness(.45) contrast(.92)}
.after .art{box-shadow:inset 0 0 0 2px rgba(255,255,255,.2),0 0 0 6px rgba(190,180,255,.45),0 40px 90px -20px rgba(154,139,255,.95)}
.badge{position:absolute;right:-20px;top:-20px;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:#1e1e22;box-shadow:inset 0 0 0 2px rgba(255,255,255,.16),0 10px 24px rgba(0,0,0,.6)}
.badge.ok{background:#34c759}
.badge svg{width:44px;height:44px}
.fmt{position:absolute;left:20px;bottom:22px;font:800 26px/40px var(--ui);letter-spacing:.08em;padding:0 14px;border-radius:12px;color:#fff;background:rgba(0,0,0,.34);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.name{margin-top:26px;text-align:center;font-size:36px;font-weight:600}
.before .name{color:#86868b}
.pill{position:absolute;left:50%;top:1318px;transform:translateX(-50%);padding:0 52px;height:104px;border-radius:52px;display:flex;align-items:center;font-size:48px;font-weight:700;color:#fff;background:var(--brand);box-shadow:0 24px 60px -20px rgba(154,139,255,.95),inset 0 2px 0 rgba(255,255,255,.4);white-space:nowrap}
.brand{position:absolute;left:0;right:0;top:1476px;display:flex;align-items:center;justify-content:center;gap:24px;font-size:56px;font-weight:700}
.icon{position:relative;width:84px;height:84px;border-radius:21px;display:grid;place-items:center;background:var(--brand);box-shadow:inset 0 2px 1px rgba(255,255,255,.55),0 16px 36px -12px rgba(122,104,255,.95)}
.icon svg{width:48px;height:48px}
.by{font:600 30px/1 var(--ui);letter-spacing:.3em;color:#a1a1a6}
</style>
</head>
